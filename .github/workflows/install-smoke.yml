name: install-smoke

on:
  push:
    branches: [main]
    paths:
      - 'install.sh'
      - 'uninstall.sh'
      - 'manifests/**'
      - 'skills/**'
      - 'lib/**'
      - 'scaffold/**'
      - '.github/workflows/install-smoke.yml'
  pull_request:
    branches: [main]
    paths:
      - 'install.sh'
      - 'uninstall.sh'
      - 'manifests/**'
      - 'skills/**'
      - 'lib/**'
      - 'scaffold/**'
      - '.github/workflows/install-smoke.yml'
  workflow_dispatch:

jobs:
  smoke:
    name: install ${{ matrix.profile }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        profile:
          - libro-core
          - libro-creator
          - libro-govcon
          - libro-ops
          - libro-full
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install profile
        run: |
          bash install.sh --profile ${{ matrix.profile }} --target "$RUNNER_TEMP/libro-${{ matrix.profile }}" --yes

      - name: Verify installed manifest matches profile manifest chain
        run: |
          # Profile manifests store skills under additive_modules.skills and
          # may declare parent_profile chains. The post-install
          # .libro-manifest.json has the resolved flat list at installed_skills.
          # Compare the resolved counts.
          python3 - <<PY
          import json, os, sys
          from pathlib import Path
          repo = Path('.')
          target = Path(os.environ['RUNNER_TEMP']) / f"libro-${{ matrix.profile }}"
          profile = '${{ matrix.profile }}'

          def chain(name):
            seen, out = set(), []
            while name and name not in seen:
              seen.add(name)
              p = json.loads((repo / 'manifests' / f'{name}.json').read_text())
              out.append(p)
              name = p.get('parent_profile')
            return out

          expected_skills = []
          for p in reversed(chain(profile)):
            expected_skills.extend(p.get('additive_modules', {}).get('skills', []))
          expected_skills = sorted(set(expected_skills))

          installed = json.loads((target / '.libro-manifest.json').read_text())
          actual_skills = sorted(installed.get('installed_skills', []))

          on_disk = sorted(p.name for p in (target / '.claude' / 'skills').iterdir() if p.is_dir())

          print(f"expected={len(expected_skills)} installed_manifest={len(actual_skills)} on_disk={len(on_disk)}")
          if expected_skills != actual_skills:
            print('DRIFT manifest:', set(expected_skills) ^ set(actual_skills)); sys.exit(1)
          if sorted(actual_skills) != on_disk:
            print('DRIFT on-disk:', set(actual_skills) ^ set(on_disk)); sys.exit(1)
          PY

      - name: Run cerebro-doctor
        run: |
          python3 "$RUNNER_TEMP/libro-${{ matrix.profile }}/.claude/skills/cerebro-doctor/Scripts/doctor.py"

      - name: Uninstall + residual probe
        run: |
          bash uninstall.sh --target "$RUNNER_TEMP/libro-${{ matrix.profile }}" --yes
          if [ -d "$RUNNER_TEMP/libro-${{ matrix.profile }}/.claude/skills" ]; then
            count=$(ls "$RUNNER_TEMP/libro-${{ matrix.profile }}/.claude/skills/" 2>/dev/null | wc -l | tr -d ' ')
            if [ "$count" != "0" ]; then
              echo "RESIDUAL: $count files left after uninstall"
              exit 1
            fi
          fi
          echo "uninstall clean"
